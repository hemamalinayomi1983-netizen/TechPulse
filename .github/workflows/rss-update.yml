name: TechPulse RSS Auto Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RSS dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS articles
        run: python rss_update.py

      - name: Commit JSON update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update TechPulse articles"
          file_pattern: articles.json
